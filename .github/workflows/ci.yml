name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init submodules
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive

      - name: Setup Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension and headless bundles
        run: npm run vscode:prepublish

      - name: Verify build artifacts
        shell: bash
        run: |
          missing=()
          for artifact in extension.js mcp_server.js eide_cli.js eide_mcp.js; do
            if [ ! -f "dist/$artifact" ]; then
              missing+=("dist/$artifact")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing build artifacts: ${missing[*]}"
            exit 1
          fi

  headless-package:
    name: Headless package E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init submodules
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive

      - name: Setup Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup .NET runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ARM GNU toolchain
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$file" ] || continue
            sudo sed -i \
              -e 's#az[0-9]*\.archive\.ubuntu\.com#us-east-2.ec2.archive.ubuntu.com#g' \
              -e 's#azure\.archive\.ubuntu\.com#us-east-2.ec2.archive.ubuntu.com#g' \
              "$file"
          done
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends gcc-arm-none-eabi

      - name: Build extension and headless bundles
        run: npm run vscode:prepublish

      - name: Package headless distribution
        run: npm run package:headless

      - name: Run installed-package E2E
        run: npm run test:headless-package
